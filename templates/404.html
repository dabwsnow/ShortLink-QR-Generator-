{% extends "base.html" %}

{% block title %}Ссылка не найдена — 404{% endblock %}

{% block content %}
<div class="card not-found-card">
    <div class="not-found-code">404</div>
    <h1 class="card-title">Ссылка не найдена</h1>
    <p class="hero-subtitle">Такой короткой ссылки не существует или она была удалена.</p>
    <a href="{% url 'shortener:index' %}" class="btn btn-primary">На главную</a>
</div>
{% endblock %}
