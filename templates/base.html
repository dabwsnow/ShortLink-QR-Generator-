{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShortLink & QR Generator{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'shortener:index' %}" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Short<span class="highlight">Link</span> & QR</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'shortener:index' %}">Главная</a>
                <a href="/api/links/" target="_blank">API</a>
                <a href="/admin/" target="_blank">Админка</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>ShortLink & QR Generator &bull;</p>
        </div>
    </footer>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
