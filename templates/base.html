{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShortLink & QR Generator{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
:root {
    --bg-main: #0d1117;
    --bg-card: #161b22;
    --bg-input: #0b0e14;
    --border: #30363d;
    --border-hover: #484f58;
    --text-primary: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15);
    --accent-hover: #79b8ff;
    --success: #3fb950;
    --danger: #f85149;
    --danger-bg: rgba(248, 81, 73, 0.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --transition: 0.2s ease;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

a {
    color: var(--accent);
    text-decoration: none;
    transition: color var(--transition);
}

a:hover {
    color: var(--accent-hover);
    text-decoration: underline;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
}

.site-header {
    border-bottom: 1px solid var(--border);
    background-color: rgba(22, 27, 34, 0.8);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none !important;
}

.logo-icon {
    font-size: 1.25rem;
}

.highlight {
    color: var(--accent);
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: var(--text-muted);
    font-size: 0.95rem;
    text-decoration: none;
    transition: color var(--transition);
}

.nav-links a:hover {
    color: var(--text-primary);
}

.main-content {
    flex: 1;
    padding: 40px 0;
}

.hero-section {
    text-align: center;
    margin-bottom: 36px;
}

.hero-title {
    font-size: 2.4rem;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 12px;
}

.gradient-text {
    background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-subtitle {
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 600px;
    margin: 0 auto 24px;
}

.stats-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
}

.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    min-width: 140px;
}

.stat-number {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
}

.stat-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 24px;
}

.card-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 20px;
}

.card-header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.card-header-flex .card-title {
    margin-bottom: 0;
}

.badge {
    background: rgba(88, 166, 255, 0.1);
    color: var(--accent);
    border: 1px solid rgba(88, 166, 255, 0.2);
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
}

.badge-accent {
    font-size: 0.95rem;
    padding: 6px 14px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
}

.form-group label {
    font-size: 0.88rem;
    color: var(--text-muted);
    font-weight: 500;
}

.form-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    width: 100%;
}

.form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}

.form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

@media (max-width: 640px) {
    .form-grid-2 {
        grid-template-columns: 1fr;
    }
}

.field-error {
    color: var(--danger);
    font-size: 0.82rem;
    margin-top: 4px;
}

.alert {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    font-size: 0.9rem;
}

.alert-error {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all var(--transition);
    text-decoration: none !important;
}

.btn-primary {
    background: #238636;
    color: #ffffff;
    width: 100%;
}

.btn-primary:hover {
    background: #2ea043;
}

.btn-secondary {
    background: #21262d;
    color: var(--text-primary);
    border: 1px solid var(--border);
}

.btn-secondary:hover {
    background: #30363d;
}

.btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger);
}

.btn-danger:hover {
    background: var(--danger);
    color: #ffffff;
}

.btn-full {
    width: 100%;
}

.btn-arrow {
    transition: transform var(--transition);
}

.btn-primary:hover .btn-arrow {
    transform: translateX(4px);
}

.table-responsive {
    overflow-x: auto;
}

.links-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    text-align: left;
}

.links-table th {
    padding: 12px 14px;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
}

.links-table td {
    padding: 14px;
    border-bottom: 1px solid rgba(48, 54, 61, 0.5);
    vertical-align: middle;
}

.short-link-badge {
    font-weight: 600;
    font-family: monospace;
    background: rgba(88, 166, 255, 0.1);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    display: inline-block;
}

.td-truncate {
    max-width: 320px;
}

.link-title {
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
}

.link-original {
    display: block;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.85rem;
}

.clicks-pill {
    background: #21262d;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.85rem;
}

.td-date {
    color: var(--text-muted);
    font-size: 0.85rem;
    white-space: nowrap;
}

.table-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.btn-action {
    background: #21262d;
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none !important;
}

.btn-action:hover {
    background: #30363d;
}

.btn-action-delete {
    color: var(--danger);
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 8px;
}

.btn-action-delete:hover {
    background: var(--danger);
    color: #ffffff;
}

.inline-form {
    display: inline;
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}

.breadcrumb {
    margin-bottom: 20px;
}

.detail-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
}

@media (max-width: 768px) {
    .detail-grid {
        grid-template-columns: 1fr;
    }
}

.qr-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.qr-preview-wrapper {
    background: #ffffff;
    padding: 16px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    display: inline-block;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.qr-image {
    display: block;
    width: 220px;
    height: 220px;
}

.qr-actions {
    width: 100%;
}

.info-block {
    margin-bottom: 20px;
}

.info-label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
}

.copy-box {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
}

.copy-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    color: var(--accent);
    font-family: monospace;
    font-size: 1rem;
    flex: 1;
    outline: none;
}

.btn-copy {
    background: var(--accent);
    color: #0b0e14;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-md);
    padding: 0 16px;
    cursor: pointer;
    transition: background var(--transition);
}

.btn-copy:hover {
    background: var(--accent-hover);
}

.test-link {
    font-size: 0.88rem;
}

.info-link-long {
    display: block;
    word-break: break-all;
    font-size: 0.92rem;
}

.stats-mini-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.stat-mini {
    display: flex;
    flex-direction: column;
}

.stat-mini-num {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
}

.stat-mini-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
}

.danger-zone {
    margin-top: 24px;
}

.font-bold {
    font-weight: 600;
}

.not-found-card {
    text-align: center;
    padding: 60px 20px;
    max-width: 500px;
    margin: 40px auto;
}

.not-found-code {
    font-size: 5rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 16px;
}

.site-footer {
    border-top: 1px solid var(--border);
    padding: 24px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    margin-top: auto;
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'shortener:index' %}" class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Short<span class="highlight">Link</span> & QR</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'shortener:index' %}">Главная</a>
                <a href="/api/links/" target="_blank">API</a>
                <a href="/admin/" target="_blank">Админка</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>ShortLink & QR Generator &bull; Django on Vercel</p>
        </div>
    </footer>

    <script src="{% static 'js/app.js' %}"></script>
    <script>
function copyShortUrl() {
    const input = document.getElementById("shortUrlInput");
    if (!input) return;

    input.select();
    input.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(input.value).then(() => {
        const btnText = document.getElementById("copyBtnText");
        if (btnText) {
            const original = btnText.textContent;
            btnText.textContent = "Скопировано!";
            setTimeout(() => {
                btnText.textContent = original;
            }, 2000);
        }
    }).catch(() => {
        document.execCommand("copy");
    });
}
    </script>
</body>
</html>
